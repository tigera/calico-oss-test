# Single source of truth for backport/release-vX.Y labels. Creates missing
# labels for current release branches; never deletes them (archive retired
# release labels manually).
#
# Triggers: 'create' (primary), 'schedule' (twice daily, recovery for missed
# creates), and 'workflow_dispatch' (manual; also the right hook for
# release-cutting automation, since 'create' is suppressed for branches
# pushed with the default GITHUB_TOKEN).

name: Sync Backport Labels
on:
  create:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

# Global lock so create + schedule + dispatch queue instead of racing.
concurrency:
  group: sync-backport-labels
  cancel-in-progress: false

jobs:
  sync:
    # Tags and non-release branches don't affect the label set.
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Ensure backport labels exist for all release branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branchRe = /^release-v\d+\.\d+$/;

            async function withRetry(fn, label) {
              const maxAttempts = 3;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  return await fn();
                } catch (e) {
                  const transient = (e.status >= 500 && e.status < 600) ||
                                    e.status === 429 ||
                                    e.status === 408 ||
                                    typeof e.status === 'undefined' ||
                                    (e.status === 403 && /rate limit|secondary/i.test(e.message || ''));
                  if (!transient || attempt === maxAttempts) throw e;
                  const delayMs = 500 * Math.pow(2, attempt - 1);
                  core.info(`Transient error on ${label} (status=${e.status}); retrying in ${delayMs}ms.`);
                  await new Promise(r => setTimeout(r, delayMs));
                }
              }
              throw new Error(`unreachable: withRetry exited loop without returning (${label})`);
            }

            // branchRe filters out shapes like release-v3.30-hotfix or release-v4.
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner, repo, ref: 'heads/release-v', per_page: 100,
            });
            const releaseBranches = refs
              .map(r => r.ref.replace(/^refs\/heads\//, ''))
              .filter(n => branchRe.test(n));

            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100,
            });
            const existing = new Set(labels.map(l => l.name));

            const labelColor = '0e8a16';
            const labelDescription = 'Cherry-pick this PR to the matching release branch.';

            let createdCount = 0;
            let failedCount = 0;
            for (const branch of releaseBranches) {
              const labelName = `backport/${branch}`;
              if (existing.has(labelName)) continue;
              core.info(`Creating label: ${labelName}`);
              try {
                await withRetry(() => github.rest.issues.createLabel({
                  owner, repo, name: labelName, color: labelColor, description: labelDescription,
                }), `createLabel(${labelName})`);
                createdCount++;
              } catch (e) {
                // 422 here = concurrent sync race (other 422 causes are
                // ruled out: color is a hardcoded valid hex, name is filtered).
                if (e.status !== 422) {
                  // Surface and continue; the next scheduled run retries.
                  core.warning(`Failed to create label ${labelName}: ${e.message}`);
                  failedCount++;
                }
              }
            }
            core.info(`Release branches: ${releaseBranches.length}, labels created: ${createdCount}, failures: ${failedCount}.`);
            if (failedCount > 0) {
              // Red run so partial syncs surface; next scheduled run retries
              // (or workflow_dispatch for an immediate retry).
              core.setFailed(`${failedCount} label(s) failed to create.`);
            }
