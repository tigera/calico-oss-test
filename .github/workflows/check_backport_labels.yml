# Gates PR merges on a backport decision. Reads release branches to render
# a single sticky comment listing backport/release-vX.Y labels and the
# pass/fail state. Fails unless the PR has skip-releases-backport or a
# backport/release-vX.Y label. Label creation is handled by
# sync_backport_labels.yml.

name: Validate Backport Labels
# pull_request_target so fork PRs get a write token. Safe only because we
# never check out the PR head or run PR-controlled content.
on:
  pull_request_target:
    # No `synchronize` — re-running on every PR push wastes API budget;
    # neither labels nor release branches can change on a push.
    types: [opened, reopened, labeled, unlabeled, ready_for_review]

concurrency:
  group: backport-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # PR comments need pull-requests:write, not issues:write — even
      # though the API path is /repos/.../issues/.../comments.
      pull-requests: write
    steps:
      - name: Check backport labels and update comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            // Same-repo vs fork PR: fork PRs always get a read-only token,
            // so 403s on writes are expected. Same-repo 403s are not.
            const isFork = pr.head?.repo?.full_name !== `${owner}/${repo}`;

            async function withRetry(fn, label) {
              const maxAttempts = 3;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  return await fn();
                } catch (e) {
                  const transient = (e.status >= 500 && e.status < 600) ||
                                    e.status === 429 ||
                                    e.status === 408 ||
                                    typeof e.status === 'undefined' ||
                                    (e.status === 403 && /rate limit|secondary/i.test(e.message || ''));
                  if (!transient || attempt === maxAttempts) throw e;
                  const delayMs = 500 * Math.pow(2, attempt - 1);
                  core.info(`Transient error on ${label} (status=${e.status}); retrying in ${delayMs}ms.`);
                  await new Promise(r => setTimeout(r, delayMs));
                }
              }
              throw new Error(`unreachable: withRetry exited loop without returning (${label})`);
            }

            // Derive expected labels from refs; sync workflow owns the label set.
            const branchRe = /^release-v\d+\.\d+$/;
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner, repo, ref: 'heads/release-v', per_page: 100,
            });
            const expectedLabels = refs
              .map(r => r.ref.replace(/^refs\/heads\//, ''))
              .filter(n => branchRe.test(n))
              .map(b => `backport/${b}`)
              .sort();

            const backportRe = /^backport\/release-v\d+\.\d+$/;
            const liveLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const prLabels = liveLabels.map(l => l.name);
            const hasNoBackport = prLabels.includes('skip-releases-backport');
            const hasBackport = prLabels.some(n => backportRe.test(n));
            const gatePassed = hasNoBackport || hasBackport;

            const marker = '<!-- backport-label-bot -->';
            const lines = [marker, '### Backport labels', ''];
            if (expectedLabels.length === 0) {
              lines.push('_No `release-vX.Y` branches currently exist; no backport labels apply._');
            } else {
              for (const n of expectedLabels) lines.push(`- \`${n}\``);
            }
            lines.push('');
            lines.push('_This list reflects release branches at the time of the last update to this comment; the PR sidebar Labels picker is always authoritative._');
            lines.push('');
            lines.push('---');
            lines.push('');
            if (gatePassed) {
              lines.push('Backport decision recorded.');
            } else {
              lines.push('This PR is missing a backport decision. Add **`skip-releases-backport`** or one of the `backport/release-vX.Y` labels above.');
            }
            const body = lines.join('\n');

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              // Comment IDs are monotonic; the Issues API doesn't document order.
              comments.sort((a, b) => a.id - b.id);
              const matches = comments.filter(c => c.body && c.body.startsWith(marker));

              // Update the oldest sticky FIRST, then delete extras. If the
              // delete step fails mid-flight the PR has duplicate stickies
              // (cosmetic), but never zero stickies.
              const oldest = matches[0];
              if (oldest) {
                if (oldest.body === body) {
                  core.info('Bot comment unchanged; skipping update to avoid notification churn.');
                } else {
                  try {
                    await withRetry(() => github.rest.issues.updateComment({
                      owner, repo, comment_id: oldest.id, body,
                    }), 'updateComment');
                  } catch (e) {
                    if (e.status === 404) {
                      // Sticky deleted between read and write — recreate.
                      await withRetry(() => github.rest.issues.createComment({
                        owner, repo, issue_number: pr.number, body,
                      }), 'createComment');
                    } else {
                      throw e;
                    }
                  }
                }
              } else {
                await withRetry(() => github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number, body,
                }), 'createComment');
              }

              if (matches.length > 1) {
                core.warning(`Found ${matches.length} bot comments; deleting ${matches.length - 1} extras.`);
                for (const extra of matches.slice(1)) {
                  try {
                    await withRetry(() => github.rest.issues.deleteComment({
                      owner, repo, comment_id: extra.id,
                    }), 'deleteComment(dup)');
                  } catch (e) {
                    core.warning(`Could not delete extra bot comment ${extra.id}: ${e.message}`);
                  }
                }
              }
            } catch (e) {
              const where = `${e.request?.method || '?'} ${e.request?.url || '?'}`;
              if (e.status === 403 && isFork) {
                // Expected on fork PRs (read-only token). Log at info.
                core.info(`Comment writes skipped (403 on ${where}: ${e.message}). Gate result is unaffected.`);
              } else if (e.status === 403) {
                // Same-repo 403 is NOT expected — likely org policy or a
                // narrowed token. Surface it.
                core.warning(`Unexpected 403 on same-repo PR (${where}: ${e.message}). Gate result is unaffected.`);
              } else if (e.status === 404 || e.status === 409 || e.status === 429 ||
                         (e.status >= 500 && e.status < 600)) {
                core.warning(`Comment-write API error (${e.status}) on ${where}: ${e.message}. Gate result is unaffected.`);
              } else {
                core.error(`Unexpected error in comment block (status=${e.status}) on ${where}: ${e.message}\n${e.stack || ''}`);
              }
            }

            core.info(`release branches: ${expectedLabels.length}, gate ${gatePassed ? 'passed' : 'failed'}.`);

            if (!gatePassed) {
              const inline = expectedLabels.length === 0
                ? '(no release branches currently exist)'
                : expectedLabels.map(n => `\`${n}\``).join(', ');
              core.setFailed(`PR must have either \`skip-releases-backport\` or a \`backport/release-vX.Y\` label. Available: ${inline}. PR: ${pr.html_url}`);
            }
